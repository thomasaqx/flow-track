spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: flow
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
  jpa:
    hibernate:
     ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      show-details: always



